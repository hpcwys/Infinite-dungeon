<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무한 던전</title>
<style>
:root{--bg:#e2e7ee;--card:#f6f8fb;--ink:#1d2433;--mut:#66708a;--line:#c8d0de;--acc:#6a4fd8;--hp:#c2413a;--xp:#2c7bd6;--ok:#1f9a6e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181d27;--ink:#e6e9f0;--mut:#8f99b2;--line:#2b3345;--acc:#9d86ff;--hp:#e5534b;--xp:#58a6ff;--ok:#3ecf94;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181d27;--ink:#e6e9f0;--mut:#8f99b2;--line:#2b3345;--acc:#9d86ff;--hp:#e5534b;--xp:#58a6ff;--ok:#3ecf94;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h1{font-size:26px;font-weight:800;margin:6px 0 4px;text-align:center}
.m{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;transition:width .1s}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
:root:not([data-theme="light"]) button.p{color:#12091f}
button:disabled{opacity:.45;cursor:default}
button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.big{width:100%;padding:13px;font-size:16px}
.es{display:flex;gap:8px;flex-wrap:wrap}
.e{flex:1;min-width:92px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.e b{display:block;font-size:12px}
.em{font-size:34px;line-height:1.1}
.fl{border-color:var(--hp)}
#log{font-size:13px;color:var(--mut);min-height:118px}
#log div:first-child{color:var(--ink);font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal>div{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;margin-top:8px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:12px;padding:1px 8px;margin:2px}
body{background:radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent),var(--bg)}
.card{box-shadow:0 2px 10px rgba(0,0,0,.12);border-radius:16px}
h1{font-size:30px;background:linear-gradient(90deg,var(--acc),var(--xp));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}
button{transition:transform .08s,border-color .15s}
button:active:not(:disabled){transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--acc),var(--xp));border:0;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent)}
.bar{height:11px;border-radius:6px;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.bar i{border-radius:6px;background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.e{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--line) 35%,var(--card)));box-shadow:0 2px 6px rgba(0,0,0,.1)}
.em{font-size:40px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.fl{animation:sh .15s;box-shadow:0 0 0 2px var(--hp)}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#modal{backdrop-filter:blur(4px)}
#modal>div{max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.chip{background:color-mix(in srgb,var(--line) 25%,transparent)}
.gr{display:flex;flex-wrap:wrap;gap:6px}
.it{padding:6px 8px;font-size:13px;line-height:1.25;border:1px solid var(--c);color:var(--c);text-align:center}
.it.sel{background:color-mix(in srgb,var(--c) 20%,var(--card));font-weight:700;box-shadow:0 0 0 1px var(--c)}
</style>
</head>
<body>
<div id="app">
 <div id="lobby"></div>
 <div id="game" hidden>
  <div class="card" id="hud"></div>
  <div class="card" id="arena"></div>
  <div class="card" id="log"></div>
  <button class="p big" id="bn" data-a="go">다음 층으로 ▶</button>
  <div class="row" style="margin:8px 0;flex-wrap:wrap;justify-content:flex-start">
   <button data-a="pot" id="bp">🧪 회복약</button>
   <button data-a="spd" data-v="1">×1</button><button data-a="spd" data-v="2">×2</button><button data-a="spd" data-v="4">×4</button>
   <button data-a="auto" id="ba">자동 진행</button>
  </div>
  <div class="card" id="abl"></div>
 </div>
</div>
<div id="modal" hidden><div></div></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[RI(0,a.length-1)],C=Math.ceil;
const SK='infdun_v1';
let M={souls:0,best:0,runs:0,tix:1,inv:[],eq:{},nid:1,ach:{},tk:0,cls:0,tier:0,mt:0,rel:{},dex:{mon:{},item:{}},up:{atk:0,hp:0,gold:0,xp:0,luck:0,crit:0,cdmg:0,aspd:0,regen:0,rare:0,soul:0}},G=null;
try{const d=JSON.parse(localStorage.getItem(SK));if(d&&d.up)M=Object.assign(M,d,{up:Object.assign(M.up,d.up)})}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(M))}catch(e){}};

const UP={atk:['⚔️','기본 공격력','+1 / Lv',12],hp:['❤️','최대 체력','+10 / Lv',12],gold:['🪙','시작 골드','+8 / Lv',8],xp:['📖','경험치 획득량','+8% / Lv',15],luck:['🍀','보물·장비 드랍 확률','+2% / Lv',20],crit:['🎯','치명타 확률','+0.5% / Lv',18],cdmg:['💥','치명타 피해','+5% / Lv',18],aspd:['⏱️','공격 속도','+2% / Lv',22],regen:['💚','체력 재생','+0.1%/초 / Lv',25],rare:['💎','장비 등급 상승','높은 등급 확률 / Lv',30],soul:['👻','영혼석 획득량','+8% / Lv',35]};
const cost=(k,l)=>C(UP[k][3]*1.6**l);
const AB={
 sword:['🗡️','강철 검','공격력 +15%',()=>G.atkM+=.15],
 vamp:['🩸','흡혈','피해량의 8%만큼 체력 회복',()=>G.steal+=.08],
 chain:['⚡','연쇄 번개','공격이 주변 적에게 35% 전파',()=>G.chain+=.35],
 bers:['😡','광전사','체력이 낮을수록 공격력 최대 +40%',()=>G.bers+=.4],
 regen:['💚','재생','초당 최대 체력의 1.2% 회복',()=>G.regen+=.012],
 crit:['🎯','치명타 전문가','치명타 확률 +10%, 피해 +20%',()=>{G.crit+=.1;G.cdmg+=.2}],
 time:['⏳','시간 왜곡','공격 속도 +20%',()=>G.aspd+=.2],
 greed:['💰','탐욕','골드 획득량 +30%',()=>G.gM+=.3],
 vit:['🛡️','강철 심장','최대 체력 +25%',()=>{const a=G.maxHp*.25;G.maxHp+=a;G.hp+=a}]
};
const MON=[[['🐀','쥐'],['🦇','박쥐'],['🟢','슬라임'],['👺','고블린']],[['💀','해골'],['🕷️','거미'],['🧟','좀비'],['🐺','늑대']],[['👻','유령'],['🦂','전갈'],['🧌','트롤'],['🐍','독사']],[['😈','악마'],['🐉','와이번'],['🗿','골렘'],['🧛','뱀파이어']],[['🌑','심연의 그림자'],['👁️','심연의 눈'],['🦑','심연의 촉수']]];
const BOSS={10:'고블린 대장',20:'해골 기사단장',30:'그림자 군주',40:'용암 거인',50:'거대 골렘 타이탄',60:'서리 마녀',70:'피의 백작',80:'폭풍 드래곤',90:'타락한 영웅',100:'심연의 지배자'};
const EV=[
 ()=>({t:'⛲ 수상한 샘',d:'맑은 물이 솟아난다. 마셔볼까?',o:[['마신다',()=>{if(Math.random()<.6){heal(G.maxHp*.5);log('💧 체력이 크게 회복되었다!')}else{G.hp-=G.maxHp*.15;log('☠️ 물에 독이 섞여 있었다...')}}],['지나친다',()=>{}]]}),
 ()=>{const c=C(30+G.floor*8);return{t:'🧙 방랑 상인',d:`공격력 +10%를 ${c}골드에 판다.`,o:[[`구매 (${c}G)`,()=>{if(G.gold>=c){G.gold-=c;G.atkM+=.1;log('🗡️ 공격력 +10%!')}else log('골드가 부족하다.')}],['거절',()=>{}]]}},
 ()=>({t:'🔥 저주받은 제단',d:'최대 체력 15%를 바치면 힘을 얻는다.',o:[['바친다',()=>{G.maxHp*=.85;G.hp=Math.min(G.hp,G.maxHp);G.atkM+=.2;log('😈 공격력 +20%, 최대 체력 -15%')}],['거절',()=>{}]]})
];

const log=m=>{G.log.push(m);if(G.log.length>40)G.log.shift()};
const heal=a=>{G.hp=Math.min(G.maxHp,G.hp+a)};
const RN=['일반','고급','희귀','전설','신화'],RM=[1,1.5,2.2,3.2,4.5],RC=['#8b93a5','#3fae6a','#3b82f6','#a855f7','#f59e0b'],SL={w:['🗡️','검'],a:['🛡️','갑옷'],h:['⛑️','투구'],r:['💍','반지']};
const eqv=s=>G.eq[s]?G.eq[s].v:0;
const dfn=()=>{const d=eqv('a')+(G.db||0);return d/(d+150)};
const TT=['','공격 속도 증가','모든 층에 정예 등장','초반부터 독 공격','체력 재생','20% 확률 치명타 (피해 2배)'];
const RL=[['🔥','불꽃의 인장','공격력 +4% / Lv'],['🧿','독사의 눈','치명타 확률 +2%·피해 +5% / Lv'],['🩸','흡혈귀의 송곳니','흡혈 +1.5% / Lv'],['🪙','약탈자의 주머니','골드 +8%·경험치 +4% / Lv'],['👑','심연의 왕관','최대 체력 +5%·방어력 +5 / Lv']];
const relRow=()=>`<p style="margin:10px 0 4px"><b>🏺 유물</b> <span class=m>난이도 단계별 몬스터가 드랍 · 중복 시 레벨업(최대 10)</span></p>${RL.map((r,i)=>{const l=M.rel[i+1]||0;return l?`<div class=m style="color:var(--acc)">${r[0]} ${r[1]} Lv.${l} — ${r[2]}</div>`:`<div class=m>❓ 🔥${i+1}단계 몬스터가 드랍</div>`}).join('')}`;
function relics(){const l=i=>M.rel[i]||0;G.atkM+=.04*l(1);G.crit+=.02*l(2);G.cdmg+=.05*l(2);G.steal+=.015*l(3);G.gM+=.08*l(4);G.xM+=.04*l(4);G.maxHp*=1+.05*l(5);G.db=(G.db||0)+5*l(5)}
function relicDrop(e){
 for(let T=1;T<=M.tier&&T<=5;T++)if(Math.random()<(T==M.tier?1:.4)*(e.boss?.25:.025)){
  const l=M.rel[T]||0,r=RL[T-1];
  if(l>=10){G.nd+=3;log(`🏺 ${r[1]} 중복 → 영혼석 +3`)}else{M.rel[T]=l+1;log(`🏺 유물 획득! ${r[0]} ${r[1]} Lv.${l+1} (다음 탐험부터 적용)`)}
  save();
 }
}
const CLS=[['⚔️','전사','기본 능력치',0,()=>{}],['🗡️','도적','치명타 확률 +15%, 최대 체력 -20%',15,()=>{G.crit+=.15;G.maxHp*=.8}],['🔮','마법사','연쇄 번개 보유, 공격력 -10%',30,()=>{G.chain+=.35;G.atkM-=.1}],['🛡️','성기사','방어력 +40, 최대 체력 +20%, 공격력 -15%',50,()=>{G.db=40;G.maxHp*=1.2;G.atkM-=.15}],['😡','광전사','체력이 낮을수록 강해짐, 흡혈 +5%',75,()=>{G.bers+=.6;G.steal+=.05}]];
const AC=[['f10','10층 도달',()=>M.best,10,5],['f30','30층 도달',()=>M.best,30,15],['f50','50층 도달',()=>M.best,50,40],['f100','100층 도달',()=>M.best,100,150],['k1','몬스터 100마리 처치',()=>M.tk,100,8],['k2','몬스터 1000마리 처치',()=>M.tk,1000,40],['k3','몬스터 5000마리 처치',()=>M.tk,5000,150],['r1','10번 도전',()=>M.runs,10,8],['r2','50번 도전',()=>M.runs,50,40],['d1','몬스터 도감 15종',()=>Object.keys(M.dex.mon).length,15,20],['d2','장비 도감 20종 완성',()=>Object.keys(M.dex.item).length,20,80],['t1','난이도 3단계 해금',()=>M.mt,3,60],['c1','모든 직업 해금',()=>CLS.filter(c=>M.best>=c[3]).length,5,50],['u1','영구 강화 합계 30레벨',()=>Object.values(M.up).reduce((a,b)=>a+b,0),30,40]];
const selRow=()=>`<div class=card><div class=row><b>직업</b><span class=m>${CLS[M.cls][2]}</span></div><div class=gr style="margin-top:6px">${CLS.map((c,i)=>M.best>=c[3]?`<button class="it${i==M.cls?' sel':''}" style="--c:var(--acc)" data-a=cls data-v=${i}>${c[0]} ${c[1]}</button>`:`<button class=it style="--c:var(--mut)" disabled>🔒 ${c[3]}층</button>`).join('')}</div><div class=row style="margin-top:10px"><b>난이도 단계</b><span class=m>영혼석 +${60*M.tier}%</span></div><div class=gr style="margin-top:6px">${[0,1,2,3,4,5].map(t=>`<button class="it${t==M.tier?' sel':''}" style="--c:var(--hp)" data-a=tier data-v=${t} ${t>M.mt?'disabled':''}>${t?'🔥'+t:'기본'}</button>`).join('')}</div><div class=m style="margin-top:6px">${M.tier?`몬스터 강화: 체력 ×1.45, 공격 ×1.25 (단계당) · ${TT.slice(1,M.tier+1).join(' · ')}`:'유물은 난이도 단계 1 이상에서 드랍됩니다'}</div>${M.mt<5?`<div class=m style="margin-top:6px">다음 단계 해금: 현재 최고 단계에서 ${20+10*M.mt}층 도달</div>`:''}</div>`;
function openAch(){
 let h=`<h3 style="margin:0">🏅 업적</h3><div class=m>달성 후 보상을 받으세요 (${Object.keys(M.ach).length}/${AC.length})</div>`;
 for(const [id,n,f,g,r] of AC){const c=Math.min(f(),g),d=M.ach[id];h+=`<div class=row style="margin-top:8px"><div style="flex:1">${d?'✅':'🏅'} ${n}<div class=bar><i style="width:${c/g*100}%;background:var(--xp)"></i></div><span class=m>${c} / ${g}</span></div><button data-a=claim data-v=${id} ${d||c<g?'disabled':''}>${d?'완료':'💎 '+r}</button></div>`}
 modal(h+`<button class="opt p" data-a=close>닫기</button>`);
}
const eqs=()=>Object.fromEntries(Object.entries(M.eq).map(([s,id])=>[s,M.inv.find(i=>i.id==id)]).filter(e=>e[1]));
const eqRow=()=>Object.keys(SL).map(s=>{const i=M.inv.find(x=>x.id==M.eq[s]);return i?`<span class=chip style="border-color:${RC[i.t]};color:${RC[i.t]}">${SL[s][0]} ${RN[i.t]} ${fv(i)}</span>`:`<span class=chip>${SL[s][0]} 비어 있음</span>`}).join('');
function openInv(){
 const E=Object.values(M.eq),ch=i=>`<button class="it${E.includes(i.id)?' sel':''}" data-a=eqp data-v=${i.id} style="--c:${RC[i.t]}">${SL[i.s][0]} ${RN[i.t]}<br><small>${fv(i)}</small></button>`;
 let h=`<h3 style="margin:0">🎒 장비 · 합성</h3><div class=m>아이템을 누르면 장착/해제됩니다. 같은 부위·등급 3개를 영혼석으로 합성하면 한 단계 높은 등급이 됩니다. (💎 ${M.souls})</div>${relRow()}`;
 for(const s in SL){
  const L=M.inv.filter(i=>i.s==s).sort((a,b)=>b.t-a.t||b.v-a.v);
  h+=`<p style="margin:10px 0 4px"><b>${SL[s][0]} ${SL[s][1]}</b> <span class=m>${L.length}개</span></p><div class=gr>${L.map(ch).join('')||'<span class=m>없음</span>'}</div>`;
  for(let t=0;t<4;t++){const c=5*(t+1)**2;if(L.filter(i=>i.t==t).length>=3)h+=`<button class=opt data-a=mix data-v=${s+t} ${M.souls<c?'disabled':''}>⚗️ ${RN[t]} ${SL[s][1]} ×3 → ${RN[t+1]} (💎 ${c})</button>`}
 }
 modal(h+`<button class="opt p" data-a=close>닫기</button>`);
}
const fv=i=>i.s=='r'?`치명 +${(i.v*100).toFixed(1)}%`:(i.s=='w'?'공격 +':i.s=='a'?'방어 +':'체력 +')+C(i.v);
function dexMon(e){const n=e.n.replace('정예 ','');if(!M.dex.mon[n]){G.nd++;log('📖 도감 등록: '+n)}M.dex.mon[n]=(M.dex.mon[n]||0)+1}
function drop(){
 const f=G.floor,s=pick(['w','a','h','r']),b=f/50+.15*M.up.rare,w=[60,25,10,4,1].map((x,i)=>x*(1+i*b));
 let x=Math.random()*w.reduce((p,q)=>p+q),t=0;while(t<4&&x>w[t]){x-=w[t];t++}
 const v=s=='w'?(2+f*.22)*RM[t]:s=='a'?(4+f*.7)*RM[t]:s=='h'?(12+f*2)*RM[t]:(.012+f*.0002)*RM[t],it={id:M.nid++,s,t,v};M.inv.push(it);
 if(!M.dex.item[s+t]){M.dex.item[s+t]=1;G.nd++;log('📖 도감 등록: '+RN[t]+' '+SL[s][1])}
 log(`${SL[s][0]} ${RN[t]} ${SL[s][1]} 획득! (${fv(it)}) · 로비에서 장착`);save();
 if(M.inv.length>40){const o=M.inv.filter(i=>!Object.values(M.eq).includes(i.id)).sort((a,b)=>a.t-b.t||a.v-b.v)[0];if(o)M.inv.splice(M.inv.indexOf(o),1)}
}
let MG=null;
function openDex(){
 const sn=n=>M.dex.mon[n]?`<span class=chip>${n} ×${M.dex.mon[n]}</span>`:'<span class=chip>❓</span>';
 let h=`<h3 style="margin:0">📖 도감</h3><div class=m>새 몬스터·장비를 등록하면 영혼석 +1</div><p style="margin:8px 0 2px"><b>몬스터</b></p>${MON.flat().map(m=>m[1]).concat(Object.values(BOSS)).map(sn).join('')}<p style="margin:8px 0 2px"><b>장비</b></p>`;
 for(const s in SL)h+=`<div>${SL[s][0]} `+RN.map((r,t)=>M.dex.item[s+t]?`<span class=chip style="color:${RC[t]};border-color:${RC[t]}">${r}</span>`:'<span class=chip>❓</span>').join('')+'</div>';
 modal(h+`<button class="opt p" data-a=mgs ${M.tix?'':'disabled'}>🔮 유령 잡기 (이용권 ${M.tix}/3)</button><button class=opt data-a=close>닫기</button>`);
}
function mgStart(){
 M.tix--;save();MG={t:15,s:0,c:[],iv:setInterval(mgTick,600)};
 modal(`<h3 style="margin:0">🔮 유령 잡기</h3><div class=m id=mgi></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px">`+[0,1,2,3,4,5,6,7,8].map(i=>`<button data-a=mg data-v=${i} id=mc${i} style="height:70px;font-size:30px"></button>`).join('')+'</div>');
 mgTick();
}
function mgTick(){
 MG.t-=.6;if(MG.t<=0)return mgEnd();
 const em=Object.keys(M.dex.mon).map(n=>(MON.flat().find(m=>m[1]==n)||['👹'])[0]).concat('👻');
 MG.c=Array(9).fill('');for(let k=RI(1,3);k>0;k--)MG.c[RI(0,8)]=pick(em);
 MG.c.forEach((v,i)=>$('#mc'+i).textContent=v);
 $('#mgi').textContent=`남은 시간 ${C(MG.t)}초 · 점수 ${MG.s}`;
}
function mgTap(i){if(MG&&MG.c[i]){MG.s++;MG.c[i]='';$('#mc'+i).textContent='💥'}}
function mgEnd(){clearInterval(MG.iv);const r=Math.min(6,Math.floor(MG.s/5));M.souls+=r;save();modal(`<h3 style="margin:0">🔮 결과: ${MG.s}점</h3><p>영혼석 <b>+${r}</b> 💎 <span class=m>(5점마다 +1, 최대 6)</span></p><button class="p big" data-a=close>돌아가기</button>`);MG=null}
function mgStop(){if(MG){clearInterval(MG.iv);MG=null}}
const need=()=>C(14+9*G.lvl**1.6);
const potCost=()=>20+G.floor*4;
const bar=(v,m,c)=>`<div class=bar><i style="width:${Math.max(0,Math.min(100,v/m*100))}%;background:var(--${c})"></i></div>`;
function modal(h){const m=$('#modal');m.hidden=!h;m.firstElementChild.innerHTML=h||''}

function newRun(){
 const u=M.up;
 G={floor:0,lvl:1,xp:0,gold:8*u.gold,kills:0,maxHp:100+10*u.hp,atk:8+u.atk,aspd:1+.02*u.aspd,crit:.05+.005*u.crit,cdmg:1.5+.05*u.cdmg,steal:0,regen:.001*u.regen,atkM:0,gM:1,xM:1+.08*u.xp,eq:{},nd:0,chain:0,bers:0,ab:{},en:[],pcd:0,poison:0,mode:'idle',log:[],auto:0,spd:1,pend:0,aw:0,fl:0,evo:[]};
 G.eq=eqs();G.maxHp+=eqv('h');CLS[M.cls][4]();relics();G.hp=G.maxHp;log('던전에 입장했다. 최고 기록을 노려 보자!');
}
function chk(){if(G.hp<=0&&G.mode!=='dead'){die();return true}return false}
function next(){
 const f=++G.floor;G.aw=0;
 
 log(`── ${f}층 ──`);
 if(f>10&&f%10&&Math.random()<.15){const d=C(G.maxHp*.08);G.hp-=d;log(`🪤 함정에 걸렸다! -${d}`);if(chk())return}
 if(f%10==0)return fight(1);
 const lk=.12+Math.min(.18,.02*M.up.luck),r=Math.random();
 if(r<lk)return treasure();
 if(r<lk+.12)return event();
 fight(0);
}
function fight(boss){
 const f=G.floor,b=f<10?0:f<30?1:f<50?2:f<100?3:4,hp=15*1.12**f*1.45**M.tier,at=2.4*1.075**f*1.25**M.tier;
 const mk=(m,h,a,x)=>({e:m[0],n:m[1],hp:h,mx:h,at:a,xm:x,iv:1.5*.93**M.tier,cd:RI(0,5)/10,fl:0});
 if(boss)G.en=[Object.assign(mk([f%100?'👹':'🌌',BOSS[f]||`심연의 파수꾼 ${f/10}`],hp*5,at*1.5,4),{boss:1})];
 else{
  let c=f>=5&&Math.random()<.35?2:1;if(f>=20&&Math.random()<.2)c=3;
  G.en=[];
  for(let i=0;i<c;i++){const el=(f>30||M.tier>=2)&&Math.random()<.2,m=mk(pick(MON[b]),hp*(c>1?.65:1)*(el?2:1),at*(c>1?.8:1)*(el?1.3:1),el?2:1);if(el)m.n='정예 '+m.n;G.en.push(m)}
 }
 G.pcd=0;G.mode='fight';
 log(boss?`🔥 보스 출현! ${G.en[0].n}`:`${G.en.map(e=>e.e).join('')} ${G.en.length>1?G.en.length+'마리 등장':G.en[0].n+' 등장'}`);
}
function hit(){
 const t=G.en[0];let d=(G.atk+eqv('w'))*(1+G.atkM)*(1+G.bers*(1-G.hp/G.maxHp));
 if(Math.random()<Math.min(.9,G.crit+eqv('r'))){d*=G.cdmg;log(`💥 치명타! ${C(d)}`)}
 t.hp-=d;t.fl=.15;
 if(G.chain)G.en.slice(1).forEach(e=>{e.hp-=d*G.chain;e.fl=.15});
 if(G.steal)heal(d*G.steal);
 for(const e of G.en)if(e.hp<=0)kill(e);
 G.en=G.en.filter(e=>e.hp>0);
}
function kill(e){
 const f=G.floor,x=C((4+1.6*f)*e.xm*G.xM),g=C((3+1.2*f)*e.xm*G.gM*(e.boss?3:1));
 G.xp+=x;G.gold+=g;G.kills++;log(`☠️ ${e.n} 처치 (+${x}XP, +${g}G)`);dexMon(e);if(e.boss||Math.random()<.22+.01*M.up.luck)drop();relicDrop(e);
 while(G.xp>=need()){G.xp-=need();G.lvl++;G.pend++}
}
function ehit(e){
 G.hp-=e.at*R(.85,1.15)*(1-dfn())*(M.tier>=5&&Math.random()<.2?2:1);G.fl=.15;
 if((G.floor>=51||M.tier>=3)&&Math.random()<.3){if(G.poison<=0)log('🧪 중독되었다!');G.poison=4}
}
function cleared(){
 G.poison=0;
 if(G.floor%10==0)log('🏆 보스를 쓰러뜨렸다!');
 afterClear();
}
function afterClear(){if(G.pend>0)return lvlUp();G.mode='idle';G.aw=0}
function lvlUp(t){
 G.mode='modal';
 const ks=Object.keys(AB).sort(()=>Math.random()-.5).slice(0,3);
 modal(`<h3 style="margin:0">${t||'⬆️ 레벨 '+G.lvl+' 달성!'}</h3><div class=m>능력을 하나 선택하세요</div>`+ks.map(k=>{const a=AB[k],l=G.ab[k]||0;return`<button class=opt data-a=pick data-v=${k}>${a[0]} <b>${a[1]}</b> <span class=m>Lv.${l}→${l+1}</span><br><span class=m>${a[2]}</span></button>`}).join(''));
}
function treasure(){
 const g=C((25+G.floor*7)*G.gM);G.gold+=g;
 log(`🎁 보물 상자! 골드 +${g}`);drop();
 if(Math.random()<.25){log('✨ 희귀 보물! 능력을 하나 더 얻는다');G.pend++;lvlUp('✨ 희귀 보물 발견!')}else afterClear();
}
function event(){
 G.mode='modal';const e=pick(EV)();G.evo=e.o;
 modal(`<h3 style="margin:0">${e.t}</h3><p>${e.d}</p>`+e.o.map((o,i)=>`<button class=opt data-a=ev data-v=${i}>${o[0]}</button>`).join(''));
}
function die(){
 const f=G.floor,s=Math.floor((f**1.3+G.gold/25+G.kills*.4)*(1+.08*M.up.soul)*(1+.6*M.tier))+G.nd,nb=f>M.best;
 G.mode='dead';M.souls+=s;M.runs++;M.tix=Math.min(3,M.tix+1);if(nb)M.best=f;M.tk+=G.kills;if(M.tier==M.mt&&M.mt<5&&f>=20+10*M.mt){M.mt++;G.tu=1}save();
 modal(`<h3 style="margin:0">☠️ ${f}층에서 쓰러졌다</h3>${nb?'<p>🏆 신기록!</p>':''}<p class=m>레벨 ${G.lvl} · 처치 ${G.kills} · 보유 골드 ${G.gold}</p><p>영혼석 <b>+${s}</b> 💎 <span class=m>(도감 등록 +${G.nd}) · 🎟️ 이용권 +1</span></p>${G.tu?'<p>🔥 새 난이도 단계가 해금되었습니다!</p>':''}<button class="p big" data-a=lobby>영구 강화하러 가기</button>`);
}

function lobby(){
 $('#game').hidden=true;const L=$('#lobby');L.hidden=false;
 let h=`<h1>⚔️ 무한 던전</h1><p class=m style="text-align:center;margin:0 0 12px">층을 오르며 능력을 골라 나만의 빌드를 만드세요.<br>쓰러져도 영혼석으로 영구 강화됩니다.</p>`;
 h+=`<div class=card><div class=row><span>🏰 최고 기록 <b>${M.best}층</b></span><span>💎 <b>${M.souls}</b></span></div><div class=m>도전 ${M.runs}회</div><div style="margin-top:6px">${eqRow()}</div></div>${selRow()}<div class=card><b>영구 강화</b>`;
 for(const k in UP){const u=UP[k],l=M.up[k],c=cost(k,l);h+=`<div class=row style="margin-top:8px"><div>${u[0]} ${u[1]}<br><span class=m>Lv.${l} · ${u[2]}</span></div><button data-a=buy data-v=${k} ${M.souls<c?'disabled':''}>💎 ${c}</button></div>`}
 L.innerHTML=h+`</div><button class=big data-a=inv style="margin-bottom:8px">🎒 장비 · 합성 (${M.inv.length})</button><button class=big data-a=ach style="margin-bottom:8px">🏅 업적 (${Object.keys(M.ach).length}/${AC.length})</button><button class=big data-a=dex style="margin-bottom:8px">📖 도감 · 미니게임 🎟️ ${M.tix}</button><button class="p big" data-a=start>${M.runs?'다시 도전':'탐험 시작'}</button>`;
}
function draw(){
 if(!G)return;
 $('#hud').innerHTML=`<div class=row><b>🏰 ${G.floor}층${G.floor%10==0?' 🔥':''}</b><span>Lv.${G.lvl}</span><span>🪙 ${G.gold}</span><span class=m>최고 ${M.best}층</span></div>${bar(G.xp,need(),'xp')}<div class=m>경험치 ${G.xp} / ${need()}</div>`;
 $('#arena').innerHTML=`<div class="e ${G.fl>0?'fl':''}"><div class=em>🤺</div><b>나 ${C(G.hp)} / ${C(G.maxHp)}${G.poison>0?' 🧪':''}</b>${bar(G.hp,G.maxHp,'ok')}<span class=m>⚔️ ${C((G.atk+eqv('w'))*(1+G.atkM))} · ⚡ ${G.aspd.toFixed(1)} · 🎯 ${C(Math.min(.9,G.crit+eqv('r'))*100)}% · 🛡️ ${C(dfn()*100)}%</span></div><div class=m style="text-align:center;margin:4px 0">VS</div><div class=es>`+(G.en.length?G.en.map(e=>`<div class="e ${e.fl>0?'fl':''}"><div class=em>${e.e}</div><b>${e.n}</b>${bar(e.hp,e.mx,'hp')}<span class=m>${C(e.hp)}</span></div>`).join(''):'<div class="e m">—</div>')+'</div>';
 $('#log').innerHTML=G.log.slice(-7).reverse().map(l=>`<div>${l}</div>`).join('');
 $('#abl').innerHTML=Object.keys(SL).map(s=>{const i=G.eq[s];return !i?`<span class=chip>${SL[s][0]} 비어 있음</span>`:`<span class=chip style="border-color:${RC[i.t]};color:${RC[i.t]}">${SL[i.s][0]} ${RN[i.t]} ${SL[i.s][1]} ${fv(i)}</span>`}).join('')+'<hr style="border:0;border-top:1px solid var(--line);margin:6px 0">'+(Object.keys(G.ab).length?Object.entries(G.ab).map(([k,l])=>`<span class=chip>${AB[k][0]} ${AB[k][1]} ${l}</span>`).join(''):'<span class=m>아직 능력이 없습니다. 레벨업하면 3개 중 하나를 고를 수 있어요.</span>');
 $('#bn').disabled=G.mode!='idle';$('#bn').textContent=G.mode=='fight'?'⚔️ 전투 중...':'다음 층으로 ▶';
 $('#bp').disabled=G.mode!='idle'||G.gold<potCost()||G.hp>=G.maxHp;$('#bp').textContent=`🧪 회복약 ${potCost()}G`;
 $('#ba').className=G.auto?'on':'';
 document.querySelectorAll('[data-a=spd]').forEach(b=>b.className=+b.dataset.v==G.spd?'on':'');
}

const A={
 start(){newRun();$('#lobby').hidden=true;$('#game').hidden=false;next()},
 lobby(){modal('');G=null;lobby()},
 go(){if(G&&G.mode=='idle')next()},
 pot(){if(G.mode=='idle'&&G.gold>=potCost()&&G.hp<G.maxHp){G.gold-=potCost();heal(G.maxHp*.3);log('🧪 회복약을 마셨다')}},
 spd(v){G.spd=+v},
 auto(){G.auto^=1},
 pick(k){AB[k][3]();G.ab[k]=(G.ab[k]||0)+1;G.pend--;log(`${AB[k][0]} ${AB[k][1]} 획득!`);modal('');afterClear()},
 ev(i){G.evo[i][1]();modal('');if(!chk())afterClear()},
 buy(k){const c=cost(k,M.up[k]);if(M.souls>=c){M.souls-=c;M.up[k]++;save();lobby()}},
 dex(){openDex()},mgs(){mgStart()},mg(i){mgTap(+i)},close(){mgStop();modal('');lobby()},
 inv(){openInv()},ach(){openAch()},claim(id){const a=AC.find(x=>x[0]==id);if(a&&!M.ach[id]&&a[2]()>=a[3]){M.ach[id]=1;M.souls+=a[4];save();openAch()}},cls(i){M.cls=+i;save();lobby()},tier(t){M.tier=+t;save();lobby()},eqp(id){const i=M.inv.find(x=>x.id==id);if(!i)return;if(M.eq[i.s]==i.id)delete M.eq[i.s];else M.eq[i.s]=i.id;save();openInv()},
 mix(k){const s=k[0],t=+k[1],c=5*(t+1)**2;if(M.souls<c)return;const E=Object.values(M.eq),L=M.inv.filter(i=>i.s==s&&i.t==t).sort((a,b)=>E.includes(a.id)-E.includes(b.id)||a.v-b.v).slice(0,3);if(L.length<3)return;const v=L.reduce((p,i)=>p+i.v,0)/3*RM[t+1]/RM[t]*1.15;L.forEach(i=>{M.inv.splice(M.inv.indexOf(i),1);if(M.eq[s]==i.id)delete M.eq[s]});M.inv.push({id:M.nid++,s,t:t+1,v});M.dex.item[s+(t+1)]=1;M.souls-=c;save();openInv()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled&&A[b.dataset.a])A[b.dataset.a](b.dataset.v);draw()});

let last=performance.now();
setInterval(()=>{
 const n=performance.now(),r=Math.min(.25,(n-last)/1000);last=n;
 if(!G||G.mode=='dead')return;
 const dt=r*G.spd;
 if(G.mode=='fight'){
  if(G.regen)heal(G.maxHp*G.regen*dt);
  if(G.poison>0){G.poison-=dt;G.hp-=G.maxHp*.03*dt}
  G.pcd+=dt;const iv=.8/G.aspd;
  while(G.pcd>=iv&&G.en.length){G.pcd-=iv;hit()}
  for(const e of G.en){if(M.tier>=4)e.hp=Math.min(e.mx,e.hp+e.mx*.015*dt);e.cd+=dt;if(e.cd>=e.iv){e.cd-=e.iv;ehit(e)}}
  G.en.forEach(e=>e.fl=Math.max(0,e.fl-dt));G.fl=Math.max(0,G.fl-dt);
  if(chk())return;
  if(!G.en.length)cleared();
 }else if(G.mode=='idle'&&G.auto&&(G.aw+=r)>.7)next();
 draw();
},100);
lobby();
</script>
</body>
</html>
